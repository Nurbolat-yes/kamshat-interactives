<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Interactive Assessment Board</title>
<style>
  /* =========================================================
     BASE & THEME
     ========================================================= */
  :root {
    --sky-1: #e6f6ff;
    --sky-2: #cfeeff;
    --sky-3: #b6e4ff;
    --aqua: #7fd8ff;
    --aqua-deep: #4fc3f7;
    --pink: #ffd1e4;
    --lavender: #e0d4ff;
    --yellow: #fff3b0;
    --ink: #1b3a57;
    --ink-soft: #3a5a78;
    --white-70: rgba(255,255,255,0.70);
    --white-50: rgba(255,255,255,0.50);
    --white-30: rgba(255,255,255,0.30);
    --shadow-soft: 0 10px 30px rgba(79, 140, 200, 0.18);
    --shadow-card: 0 14px 32px rgba(79, 140, 200, 0.22), 0 2px 6px rgba(79,140,200,0.12);
    --shadow-card-hover: 0 22px 50px rgba(79, 140, 200, 0.30), 0 4px 10px rgba(79,140,200,0.16);
    --radius-card: 26px;
    --radius-pill: 999px;
    --ease: cubic-bezier(.2,.8,.2,1);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    background:
      radial-gradient(1200px 800px at 10% -10%, #ffffff 0%, transparent 60%),
      radial-gradient(900px 700px at 110% 10%, #ffe9f3 0%, transparent 55%),
      radial-gradient(1000px 700px at 50% 120%, #e6f3ff 0%, transparent 55%),
      linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 55%, var(--sky-3) 100%);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* =========================================================
     DECORATIVE BACKGROUND (bubbles, flowers, hearts, stars)
     ========================================================= */
  .bg-layer {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    overflow: hidden;
  }
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.15) 60%, rgba(127,216,255,0.15));
    box-shadow: inset 0 0 20px rgba(255,255,255,0.6), 0 6px 20px rgba(127,216,255,0.25);
    animation: floaty 14s ease-in-out infinite;
    opacity: 0.75;
  }
  .bubble::after {
    content: "";
    position: absolute; top: 14%; left: 18%;
    width: 22%; height: 22%; border-radius: 50%;
    background: rgba(255,255,255,0.85);
    filter: blur(1px);
  }
  .sticker {
    position: absolute;
    font-size: 28px;
    opacity: 0.55;
    filter: drop-shadow(0 4px 8px rgba(79,140,200,0.25));
    animation: bob 9s ease-in-out infinite;
    user-select: none;
  }
  @keyframes floaty {
    0%,100% { transform: translate3d(0,0,0) scale(1); }
    50% { transform: translate3d(0,-24px,0) scale(1.04); }
  }
  @keyframes bob {
    0%,100% { transform: translate3d(0,0,0) rotate(-4deg); }
    50% { transform: translate3d(0,-14px,0) rotate(6deg); }
  }

  /* =========================================================
     LAYOUT
     ========================================================= */
  .app {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding: 28px 22px 60px;
  }

  header.hero {
    text-align: center;
    padding: 10px 10px 22px;
  }
  .title {
    font-size: clamp(28px, 4vw, 46px);
    font-weight: 800;
    letter-spacing: 0.3px;
    margin: 0;
    background: linear-gradient(90deg, #1e6fb8, #4fc3f7 40%, #ff8fb8 70%, #ffb347);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 6px 20px rgba(79,140,200,0.15);
  }
  .subtitle {
    margin: 8px 0 0;
    font-size: clamp(14px, 1.6vw, 18px);
    color: var(--ink-soft);
    font-weight: 500;
  }

  /* =========================================================
     BOARD (two rows)
     ========================================================= */
  .board {
    display: flex;
    flex-direction: column;
    gap: 22px;
    margin-top: 10px;
  }
  .row {
    display: grid;
    gap: 18px;
    justify-content: center;
  }
  .row-top { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .row-bottom { grid-template-columns: repeat(6, minmax(0, 1fr)); }

  @media (max-width: 1200px) {
    .row-top, .row-bottom { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  @media (max-width: 900px) {
    .row-top, .row-bottom { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 620px) {
    .row-top, .row-bottom { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .app { padding: 18px 14px 40px; }
  }
  @media (max-width: 380px) {
    .row-top, .row-bottom { grid-template-columns: 1fr; }
  }

  /* =========================================================
     CARD
     ========================================================= */
  .card {
    position: relative;
    border-radius: var(--radius-card);
    padding: 16px 14px 14px;
    color: var(--ink);
    background: linear-gradient(180deg, rgba(255,255,255,0.75), rgba(255,255,255,0.55));
    border: 1px solid rgba(255,255,255,0.7);
    backdrop-filter: blur(14px) saturate(130%);
    -webkit-backdrop-filter: blur(14px) saturate(130%);
    box-shadow: var(--shadow-card);
    transform: translate3d(0,0,0);
    transition: transform .35s var(--ease), box-shadow .35s var(--ease), background .5s var(--ease);
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    min-height: 230px;
    isolation: isolate;
  }
  .card::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    background: linear-gradient(180deg, var(--tint-a, rgba(127,216,255,0.35)), var(--tint-b, rgba(255,255,255,0.05)));
    opacity: 0.9;
    z-index: -1;
    transition: opacity .5s var(--ease);
  }
  .card::after {
    content: "";
    position: absolute;
    top: 10px; left: 14px; right: 14px;
    height: 40%;
    border-radius: 20px;
    background: linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0));
    pointer-events: none;
  }
  .card:hover { transform: translate3d(0,-6px,0) scale(1.015); box-shadow: var(--shadow-card-hover); }
  .card:focus-within { outline: none; box-shadow: 0 0 0 3px rgba(79,195,247,0.55), var(--shadow-card); }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .score-badge {
    font-weight: 800;
    font-size: 18px;
    color: #fff;
    background: linear-gradient(135deg, #4fc3f7, #1e88e5);
    padding: 6px 12px;
    border-radius: var(--radius-pill);
    box-shadow: 0 6px 14px rgba(30,136,229,0.35), inset 0 1px 0 rgba(255,255,255,0.5);
    min-width: 44px;
    text-align: center;
    letter-spacing: 0.5px;
    transition: transform .25s var(--ease), background .4s var(--ease);
  }
  .reset-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.75);
    color: var(--ink-soft);
    font-size: 16px;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: transform .2s var(--ease), background .2s var(--ease), color .2s var(--ease);
    box-shadow: 0 4px 10px rgba(79,140,200,0.18);
  }
  .reset-btn:hover { background: #fff; color: #e53935; transform: rotate(-45deg); }
  .reset-btn:focus-visible { outline: 3px solid rgba(79,195,247,0.6); outline-offset: 2px; }

  .card-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    border-radius: 18px;
    padding: 6px 4px;
    transition: background .25s var(--ease);
    user-select: none;
  }
  .card-body:hover { background: rgba(255,255,255,0.35); }
  .card-body:active .emoji { transform: scale(0.95); }

  .emoji {
    font-size: clamp(48px, 6vw, 68px);
    line-height: 1;
    filter: drop-shadow(0 6px 10px rgba(79,140,200,0.25));
    transition: transform .3s var(--ease);
  }
  .emoji.pop { animation: pop .45s var(--ease); }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.22) rotate(-4deg); }
    70% { transform: scale(0.96) rotate(2deg); }
    100% { transform: scale(1) rotate(0); }
  }
  .emotion-label {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: var(--ink-soft);
    text-transform: uppercase;
  }
  .name {
    font-size: clamp(15px, 1.5vw, 18px);
    font-weight: 800;
    color: var(--ink);
    text-align: center;
    word-break: break-word;
    overflow-wrap: anywhere;
    line-height: 1.15;
  }

  .progress {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 3px;
    padding: 2px;
  }
  .seg {
    height: 8px;
    border-radius: 4px;
    background: rgba(255,255,255,0.6);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), inset 0 -1px 0 rgba(79,140,200,0.15);
    transition: background .35s var(--ease), transform .3s var(--ease);
  }
  .seg.filled {
    background: linear-gradient(180deg, var(--seg-a, #7fd8ff), var(--seg-b, #1e88e5));
    box-shadow: 0 2px 6px rgba(30,136,229,0.35), inset 0 1px 0 rgba(255,255,255,0.6);
    transform: translateY(-1px);
  }
  .seg.pop-seg { animation: segPop .35s var(--ease); }
  @keyframes segPop {
    0% { transform: scale(1,1); }
    50% { transform: scale(1, 1.6); }
    100% { transform: scale(1,1); }
  }

  .card-actions {
    display: flex;
    gap: 8px;
    justify-content: space-between;
  }
  .step-btn {
    flex: 1;
    min-height: 40px;
    border: none;
    border-radius: 14px;
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
    color: #fff;
    background: linear-gradient(180deg, #6ec6ff, #1e88e5);
    box-shadow: 0 8px 16px rgba(30,136,229,0.35), inset 0 1px 0 rgba(255,255,255,0.5);
    transition: transform .18s var(--ease), box-shadow .18s var(--ease), filter .2s var(--ease);
  }
  .step-btn.minus { background: linear-gradient(180deg, #ffc1e3, #ff7fb6); box-shadow: 0 8px 16px rgba(255,127,182,0.35), inset 0 1px 0 rgba(255,255,255,0.5); }
  .step-btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
  .step-btn:active { transform: translateY(1px); }
  .step-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; filter: grayscale(0.2); }
  .step-btn:focus-visible { outline: 3px solid rgba(79,195,247,0.6); outline-offset: 2px; }

  /* Level-driven tints */
  .card[data-level="1"]  { --tint-a: rgba(176,210,235,0.45); --tint-b: rgba(255,255,255,0.1); --seg-a:#b0d2eb; --seg-b:#7aa7c7; }
  .card[data-level="2"]  { --tint-a: rgba(186,222,245,0.50); --tint-b: rgba(255,255,255,0.1); --seg-a:#9cc8ea; --seg-b:#5a9bc7; }
  .card[data-level="3"]  { --tint-a: rgba(200,232,250,0.55); --tint-b: rgba(255,255,255,0.1); --seg-a:#86bee4; --seg-b:#4390c0; }
  .card[data-level="4"]  { --tint-a: rgba(214,240,255,0.60); --tint-b: rgba(255,255,255,0.1); --seg-a:#72b6e0; --seg-b:#2e84b8; }
  .card[data-level="5"]  { --tint-a: rgba(195,235,255,0.65); --tint-b: rgba(255,255,255,0.1); --seg-a:#5eaedd; --seg-b:#1f78ae; }
  .card[data-level="6"]  { --tint-a: rgba(200,245,235,0.65); --tint-b: rgba(255,255,255,0.1); --seg-a:#6fd0c4; --seg-b:#2aa89a; }
  .card[data-level="7"]  { --tint-a: rgba(225,245,200,0.70); --tint-b: rgba(255,255,255,0.1); --seg-a:#9ed57a; --seg-b:#56a84a; }
  .card[data-level="8"]  { --tint-a: rgba(255,245,180,0.75); --tint-b: rgba(255,255,255,0.1); --seg-a:#ffcf5c; --seg-b:#e69a1a; }
  .card[data-level="9"]  { --tint-a: rgba(255,215,180,0.80); --tint-b: rgba(255,255,255,0.1); --seg-a:#ffa15c; --seg-b:#e56a1a; }
  .card[data-level="10"] { --tint-a: rgba(255,200,225,0.85); --tint-b: rgba(255,240,180,0.6); --seg-a:#ff7fb6; --seg-b:#ff3d87; }
  .card[data-level="10"] .score-badge {
    background: linear-gradient(135deg, #ff7fb6, #ffb347);
    box-shadow: 0 6px 14px rgba(255,61,135,0.45), inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .card[data-level="10"] { animation: glowPulse 2.4s ease-in-out infinite; }
  @keyframes glowPulse {
    0%,100% { box-shadow: var(--shadow-card), 0 0 0 rgba(255,127,182,0); }
    50% { box-shadow: var(--shadow-card-hover), 0 0 30px rgba(255,127,182,0.35); }
  }

  /* =========================================================
     STATS & CONTROLS
     ========================================================= */
  .stats {
    margin-top: 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
  }
  .stat-chip {
    background: rgba(255,255,255,0.7);
    border: 1px solid rgba(255,255,255,0.8);
    border-radius: var(--radius-pill);
    padding: 10px 18px;
    font-weight: 700;
    color: var(--ink-soft);
    box-shadow: 0 6px 16px rgba(79,140,200,0.15);
    backdrop-filter: blur(10px);
  }
  .stat-chip b { color: var(--ink); margin-left: 6px; }

  .controls {
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    align-items: center;
  }
  .ctrl-btn {
    min-height: 44px;
    padding: 10px 18px;
    border: none;
    border-radius: var(--radius-pill);
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    background: linear-gradient(180deg, #6ec6ff, #1e88e5);
    box-shadow: 0 8px 18px rgba(30,136,229,0.35), inset 0 1px 0 rgba(255,255,255,0.5);
    transition: transform .18s var(--ease), filter .2s var(--ease);
  }
  .ctrl-btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
  .ctrl-btn:active { transform: translateY(1px); }
  .ctrl-btn:focus-visible { outline: 3px solid rgba(79,195,247,0.6); outline-offset: 2px; }
  .ctrl-btn.danger { background: linear-gradient(180deg, #ff9ec7, #e91e63); box-shadow: 0 8px 18px rgba(233,30,99,0.35), inset 0 1px 0 rgba(255,255,255,0.5); }
  .ctrl-btn[aria-pressed="true"] { background: linear-gradient(180deg, #9be3ff, #29b6f6); }

  .volume-wrap {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.7);
    border: 1px solid rgba(255,255,255,0.8);
    border-radius: var(--radius-pill);
    padding: 8px 14px;
    box-shadow: 0 6px 16px rgba(79,140,200,0.15);
  }
  .volume-wrap label { font-weight: 700; color: var(--ink-soft); font-size: 14px; }
  .volume-wrap input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 120px; height: 6px; border-radius: 999px;
    background: linear-gradient(90deg, #bfe8ff, #4fc3f7);
    outline: none;
  }
  .volume-wrap input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; border-radius: 50%;
    background: #fff; border: 2px solid #1e88e5;
    box-shadow: 0 2px 6px rgba(30,136,229,0.4);
    cursor: pointer;
  }
  .volume-wrap input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%;
    background: #fff; border: 2px solid #1e88e5;
    box-shadow: 0 2px 6px rgba(30,136,229,0.4);
    cursor: pointer;
  }

  /* =========================================================
     CONFETTI
     ========================================================= */
  .confetti-host {
    position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 5;
  }
  .confetti {
    position: absolute;
    width: 10px; height: 14px;
    border-radius: 2px;
    opacity: 0.95;
    animation: confettiFall 1.4s cubic-bezier(.2,.7,.3,1) forwards;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
  }
  @keyframes confettiFall {
    0% { transform: translate3d(0,0,0) rotate(0deg) scale(0.6); opacity: 0; }
    15% { opacity: 1; transform: translate3d(var(--dx1), var(--dy1), 0) rotate(90deg) scale(1); }
    100% { transform: translate3d(var(--dx2), var(--dy2), 0) rotate(540deg) scale(0.9); opacity: 0; }
  }

  /* =========================================================
     TOAST
     ========================================================= */
  .toast-wrap {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    z-index: 50; display: flex; flex-direction: column; gap: 10px; align-items: center;
    pointer-events: none;
  }
  .toast {
    pointer-events: auto;
    background: rgba(255,255,255,0.92);
    border: 1px solid rgba(255,255,255,0.9);
    color: var(--ink);
    padding: 12px 18px;
    border-radius: 16px;
    box-shadow: 0 14px 30px rgba(79,140,200,0.25);
    font-weight: 700;
    display: flex; gap: 10px; align-items: center;
    animation: toastIn .3s var(--ease);
    backdrop-filter: blur(10px);
  }
  .toast button {
    border: none; cursor: pointer; padding: 8px 12px; border-radius: 10px;
    font-weight: 800;
  }
  .toast .confirm { background: linear-gradient(180deg, #ff9ec7, #e91e63); color: #fff; }
  .toast .cancel { background: #eaf4fb; color: var(--ink-soft); }
  @keyframes toastIn {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* =========================================================
     REDUCED MOTION
     ========================================================= */
  @media (prefers-reduced-motion: reduce) {
    .bubble, .sticker, .card[data-level="10"] { animation: none !important; }
    .emoji.pop, .seg.pop-seg, .confetti, .toast { animation: none !important; }
    .card, .step-btn, .ctrl-btn, .reset-btn, .score-badge { transition: none !important; }
  }

  /* Screen-reader only */
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>

  <!-- Decorative background layer -->
  <div class="bg-layer" id="bgLayer" aria-hidden="true"></div>

  <div class="app">
    <header class="hero">
      <h1 class="title">Interactive Assessment Board</h1>
      <p class="subtitle">Every little step deserves a smile!</p>
    </header>

    <main>
      <section class="board" id="board" aria-label="Student assessment board">
        <div class="row row-top" id="rowTop" aria-label="First row"></div>
        <div class="row row-bottom" id="rowBottom" aria-label="Second row"></div>
      </section>

      <section class="stats" aria-label="Class statistics">
        <div class="stat-chip">Class average<b id="statAvg">1.0</b></div>
        <div class="stat-chip">Top stars (10)<b id="statTop">0</b></div>
      </section>

      <section class="controls" aria-label="Controls">
        <button class="ctrl-btn" id="btnSfx" type="button" aria-pressed="true">🔊 Sound Effects: On</button>
        <button class="ctrl-btn" id="btnMusic" type="button" aria-pressed="false">🎵 Music: Off</button>
        <div class="volume-wrap">
          <label for="volMusic">Music volume</label>
          <input id="volMusic" type="range" min="0" max="100" value="35" />
        </div>
        <button class="ctrl-btn danger" id="btnResetAll" type="button">↺ Reset All</button>
      </section>
    </main>
  </div>

  <div class="toast-wrap" id="toastWrap" aria-live="polite" aria-atomic="true"></div>

<script>
/* =============================================================
   DATA — students & emotions
   Edit names here (Latin display + Kazakh original kept for reference).
   ============================================================= */
const students = [
  { id: "s1",  name: "Inabat",     kz: "Инабат" },
  { id: "s2",  name: "Ayaru",      kz: "Айару" },
  { id: "s3",  name: "Fatima",     kz: "Фатима" },
  { id: "s4",  name: "Kausar",     kz: "Кәусар" },
  { id: "s5",  name: "Rayana",     kz: "Раяна" },
  { id: "s6",  name: "Nuraiym",    kz: "Нұрайым" },
  { id: "s7",  name: "Sultaniyar", kz: "Сұлтанияр" },
  { id: "s8",  name: "Ayala",      kz: "Аяла" },
  { id: "s9",  name: "Shahislam",  kz: "Шахислам" },
  { id: "s10", name: "Damir",      kz: "Дамир" },
  { id: "s11", name: "Raikhan",    kz: "Райхан" }
];

const ROW_SPLIT = 5; // first 5 in top row, rest in bottom

const LEVELS = [
  null, // index 0 unused
  { emoji: "😭", label: "Very Sad" },
  { emoji: "😢", label: "Sad" },
  { emoji: "🙁", label: "Not Great" },
  { emoji: "😕", label: "Unsure" },
  { emoji: "😐", label: "Okay" },
  { emoji: "🙂", label: "Fine" },
  { emoji: "😊", label: "Good" },
  { emoji: "😄", label: "Great" },
  { emoji: "🤩", label: "Amazing" },
  { emoji: "🥳", label: "WOW! HAPPY!" }
];

/* =============================================================
   STATE & PERSISTENCE
   ============================================================= */
const STORAGE_KEY = "interactive_assessment_board_v1";
const state = {
  scores: {},           // id -> 1..10
  audio: { sfx: true, music: true, musicVol: 0.35 }
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data && typeof data === "object") {
      if (data.scores && typeof data.scores === "object") {
        for (const s of students) {
          const v = Number(data.scores[s.id]);
          state.scores[s.id] = Number.isFinite(v) ? Math.min(10, Math.max(1, v)) : 1;
        }
      }
      if (data.audio && typeof data.audio === "object") {
        state.audio.sfx = data.audio.sfx !== false;
        state.audio.music = data.audio.music !== false;
        state.audio.musicVol = typeof data.audio.musicVol === "number"
          ? Math.min(1, Math.max(0, data.audio.musicVol)) : 0.35;
      }
    }
  } catch (e) { /* ignore corrupted storage */ }
}
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      scores: state.scores,
      audio: state.audio
    }));
  } catch (e) { /* ignore quota errors */ }
}

// Initialize scores to 1 if missing
for (const s of students) {
  if (typeof state.scores[s.id] !== "number") state.scores[s.id] = 1;
}

/* =============================================================
   RENDERING
   ============================================================= */
const rowTop = document.getElementById("rowTop");
const rowBottom = document.getElementById("rowBottom");
const statAvg = document.getElementById("statAvg");
const statTop = document.getElementById("statTop");

function makeCard(student) {
  const card = document.createElement("article");
  card.className = "card";
  card.dataset.id = student.id;
  card.dataset.level = String(state.scores[student.id]);
  card.setAttribute("aria-label", `${student.name}'s assessment card`);

  // Top bar
  const top = document.createElement("div");
  top.className = "card-top";

  const badge = document.createElement("div");
  badge.className = "score-badge";
  badge.setAttribute("aria-hidden", "true");
  badge.textContent = String(state.scores[student.id]);

  const resetBtn = document.createElement("button");
  resetBtn.className = "reset-btn";
  resetBtn.type = "button";
  resetBtn.setAttribute("aria-label", `Reset ${student.name}'s score to 1`);
  resetBtn.title = "Reset to 1";
  resetBtn.textContent = "↺";
  resetBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    setScore(student.id, 1, { source: "reset" });
  });

  top.appendChild(badge);
  top.appendChild(resetBtn);

  // Body (clickable to increment)
  const body = document.createElement("div");
  body.className = "card-body";
  body.setAttribute("role", "button");
  body.setAttribute("tabindex", "0");
  body.setAttribute("aria-label", `Increase ${student.name}'s score. Current: ${state.scores[student.id]} of 10`);

  const emoji = document.createElement("div");
  emoji.className = "emoji";
  emoji.setAttribute("aria-hidden", "true");
  emoji.textContent = LEVELS[state.scores[student.id]].emoji;

  const label = document.createElement("div");
  label.className = "emotion-label";
  label.textContent = LEVELS[state.scores[student.id]].label;

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = student.name;

  const progress = document.createElement("div");
  progress.className = "progress";
  progress.setAttribute("aria-hidden", "true");
  for (let i = 1; i <= 10; i++) {
    const seg = document.createElement("div");
    seg.className = "seg" + (i <= state.scores[student.id] ? " filled" : "");
    seg.dataset.index = String(i);
    progress.appendChild(seg);
  }

  body.appendChild(emoji);
  body.appendChild(label);
  body.appendChild(name);
  body.appendChild(progress);

  const activateBody = (e) => {
    // Prevent double-fire from child buttons bubbling
    if (e.target.closest("button")) return;
    bumpScore(student.id, +1, { source: "tap" });
  };
  body.addEventListener("click", activateBody);
  body.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      bumpScore(student.id, +1, { source: "tap" });
    }
  });

  // Actions row: minus / plus
  const actions = document.createElement("div");
  actions.className = "card-actions";

  const minus = document.createElement("button");
  minus.className = "step-btn minus";
  minus.type = "button";
  minus.textContent = "−";
  minus.setAttribute("aria-label", `Decrease ${student.name}'s score`);
  minus.addEventListener("click", (e) => {
    e.stopPropagation();
    bumpScore(student.id, -1, { source: "btn" });
  });

  const plus = document.createElement("button");
  plus.className = "step-btn plus";
  plus.type = "button";
  plus.textContent = "+";
  plus.setAttribute("aria-label", `Increase ${student.name}'s score`);
  plus.addEventListener("click", (e) => {
    e.stopPropagation();
    bumpScore(student.id, +1, { source: "btn" });
  });

  actions.appendChild(minus);
  actions.appendChild(plus);

  card.appendChild(top);
  card.appendChild(body);
  card.appendChild(actions);

  return card;
}

function renderBoard() {
  rowTop.innerHTML = "";
  rowBottom.innerHTML = "";
  students.forEach((s, idx) => {
    const card = makeCard(s);
    if (idx < ROW_SPLIT) rowTop.appendChild(card);
    else rowBottom.appendChild(card);
  });
  updateStats();
}

function updateCard(id, opts = {}) {
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if (!card) return;
  const level = state.scores[id];
  const info = LEVELS[level];

  card.dataset.level = String(level);
  card.querySelector(".score-badge").textContent = String(level);

  const emoji = card.querySelector(".emoji");
  emoji.textContent = info.emoji;
  if (opts.animate) {
    emoji.classList.remove("pop");
    // force reflow for re-trigger
    void emoji.offsetWidth;
    emoji.classList.add("pop");
  }

  card.querySelector(".emotion-label").textContent = info.label;

  const body = card.querySelector(".card-body");
  const student = students.find(s => s.id === id);
  body.setAttribute("aria-label", `Increase ${student.name}'s score. Current: ${level} of 10`);

  const segs = card.querySelectorAll(".seg");
  segs.forEach((seg, i) => {
    const filled = (i + 1) <= level;
    seg.classList.toggle("filled", filled);
    if (opts.animate && filled && (i + 1) === level) {
      seg.classList.remove("pop-seg");
      void seg.offsetWidth;
      seg.classList.add("pop-seg");
    }
  });

  // Update step button disabled state
  const minus = card.querySelector(".step-btn.minus");
  const plus = card.querySelector(".step-btn.plus");
  minus.disabled = level <= 1;
  plus.disabled = level >= 10;
}

function updateStats() {
  const vals = students.map(s => state.scores[s.id]);
  const sum = vals.reduce((a, b) => a + b, 0);
  const avg = (sum / vals.length).toFixed(1);
  const topCount = vals.filter(v => v === 10).length;
  statAvg.textContent = avg;
  statTop.textContent = String(topCount);
}

/* =============================================================
   SCORE LOGIC
   ============================================================= */
function setScore(id, value, opts = {}) {
  const prev = state.scores[id];
  const next = Math.min(10, Math.max(1, value));
  if (next === prev) return;
  state.scores[id] = next;

  updateCard(id, { animate: true });
  updateStats();
  saveState();

  // Sound decisions
  if (opts.source !== "restore") {
    if (opts.source === "reset") {
      sfxReset();
    } else if (next > prev) {
      if (next === 10 && prev !== 10) {
        sfxWow();
        celebrateCard(id);
      } else if (next >= 8) {
        sfxGreat(next);
      } else {
        sfxUp(next);
      }
    } else {
      sfxDown(next);
    }
  }
}

function bumpScore(id, delta, opts = {}) {
  const next = state.scores[id] + delta;
  setScore(id, next, opts);
}

/* =============================================================
   CONFETTI (lightweight, per-card)
   ============================================================= */
function celebrateCard(id) {
  if (prefersReducedMotion()) return;
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if (!card) return;

  let host = card.querySelector(".confetti-host");
  if (!host) {
    host = document.createElement("div");
    host.className = "confetti-host";
    card.appendChild(host);
  }
  host.innerHTML = "";

  const colors = ["#ff7fb6", "#ffb347", "#7fd8ff", "#b39dff", "#ffe066", "#6ee7b7"];
  const count = 26;
  const rect = card.getBoundingClientRect();
  const cx = rect.width / 2;
  const cy = rect.height / 2;

  for (let i = 0; i < count; i++) {
    const c = document.createElement("span");
    c.className = "confetti";
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
    const dist1 = 30 + Math.random() * 40;
    const dist2 = 80 + Math.random() * 90;
    const dx1 = Math.cos(angle) * dist1;
    const dy1 = Math.sin(angle) * dist1 - 20;
    const dx2 = Math.cos(angle) * dist2;
    const dy2 = Math.sin(angle) * dist2 + 40;
    c.style.left = cx + "px";
    c.style.top = cy + "px";
    c.style.setProperty("--dx1", dx1 + "px");
    c.style.setProperty("--dy1", dy1 + "px");
    c.style.setProperty("--dx2", dx2 + "px");
    c.style.setProperty("--dy2", dy2 + "px");
    c.style.background = colors[i % colors.length];
    c.style.animationDelay = (Math.random() * 0.12) + "s";
    c.style.transform = `rotate(${Math.random() * 360}deg)`;
    host.appendChild(c);
  }
  setTimeout(() => { host.innerHTML = ""; }, 1600);
}

function prefersReducedMotion() {
  return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

/* =============================================================
   AUDIO ENGINE (Web Audio API)
   ============================================================= */
let audioCtx = null;
let masterGain = null;
let sfxGain = null;
let musicGain = null;
let musicScheduler = null;
let musicNextTime = 0;
let musicPlaying = false;
let activeVoices = 0;
const MAX_VOICES = 6;

function ensureAudio() {
  if (audioCtx) return audioCtx;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    audioCtx = new Ctx();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.9;
    masterGain.connect(audioCtx.destination);

    sfxGain = audioCtx.createGain();
    sfxGain.gain.value = state.audio.sfx ? 0.9 : 0;
    sfxGain.connect(masterGain);

    musicGain = audioCtx.createGain();
    musicGain.gain.value = state.audio.music ? state.audio.musicVol : 0;
    musicGain.connect(masterGain);
  } catch (e) {
    audioCtx = null;
  }
  return audioCtx;
}

function resumeAudio() {
  const ctx = ensureAudio();
  if (ctx && ctx.state === "suspended") {
    ctx.resume().catch((e) => console.warn("Unable to resume audio:", e));
  }
}

function voiceStart() {
  if (activeVoices >= MAX_VOICES) return false;
  activeVoices++;
  return true;
}
function voiceEnd() {
  activeVoices = Math.max(0, activeVoices - 1);
}

// Short envelope helper
function playTone({ freq = 440, type = "sine", start = 0, dur = 0.2, peak = 0.25, attack = 0.01, release = 0.12, dest = null, detune = 0 } = {}) {
  const ctx = ensureAudio();
  if (!ctx) return;
  if (!voiceStart()) return;
  const now = ctx.currentTime + start;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  osc.detune.value = detune;
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(peak, now + attack);
  g.gain.linearRampToValueAtTime(peak * 0.7, now + attack + Math.max(0, dur - attack - release));
  g.gain.linearRampToValueAtTime(0.0001, now + dur);
  osc.connect(g);
  g.connect(dest || sfxGain);
  osc.start(now);
  osc.stop(now + dur + 0.05);
  osc.onended = () => {
    try { osc.disconnect(); g.disconnect(); } catch (e) {}
    voiceEnd();
  };
}

/* --- SFX --- */
function sfxUp(level) {
  if (!state.audio.sfx) return;
  resumeAudio();
  // Pitch rises with level
  const base = 440 + (level - 1) * 35; // ~440..755
  playTone({ freq: base, type: "triangle", dur: 0.18, peak: 0.22, attack: 0.005, release: 0.12 });
  playTone({ freq: base * 1.5, type: "sine", dur: 0.16, peak: 0.12, attack: 0.005, release: 0.1, start: 0.03 });
}
function sfxDown(level) {
  if (!state.audio.sfx) return;
  resumeAudio();
  const ctx = ensureAudio(); if (!ctx) return;
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(520, now);
  osc.frequency.exponentialRampToValueAtTime(260, now + 0.22);
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.18, now + 0.01);
  g.gain.linearRampToValueAtTime(0.0001, now + 0.25);
  osc.connect(g); g.connect(sfxGain);
  if (!voiceStart()) return;
  osc.start(now); osc.stop(now + 0.3);
  osc.onended = () => { try { osc.disconnect(); g.disconnect(); } catch(e){} voiceEnd(); };
}
function sfxGreat(level) {
  if (!state.audio.sfx) return;
  resumeAudio();
  const base = 660 + (level - 8) * 80;
  playTone({ freq: base, type: "triangle", dur: 0.22, peak: 0.24, attack: 0.005, release: 0.14 });
  playTone({ freq: base * 1.25, type: "sine", dur: 0.22, peak: 0.16, start: 0.05, attack: 0.005, release: 0.14 });
  playTone({ freq: base * 1.5, type: "sine", dur: 0.22, peak: 0.12, start: 0.1, attack: 0.005, release: 0.14 });
}
function sfxWow() {
  if (!state.audio.sfx) return;
  resumeAudio();
  // Celebratory ascending arpeggio
  const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5]; // C5 E5 G5 C6 E6
  notes.forEach((f, i) => {
    playTone({ freq: f, type: "triangle", dur: 0.28, peak: 0.22, start: i * 0.08, attack: 0.005, release: 0.18 });
    playTone({ freq: f * 2, type: "sine", dur: 0.22, peak: 0.08, start: i * 0.08 + 0.02, attack: 0.005, release: 0.14 });
  });
  // Sparkle
  playTone({ freq: 1760, type: "sine", dur: 0.5, peak: 0.08, start: 0.4, attack: 0.01, release: 0.4 });
}
function sfxReset() {
  if (!state.audio.sfx) return;
  resumeAudio();
  playTone({ freq: 330, type: "sine", dur: 0.14, peak: 0.12, attack: 0.005, release: 0.1 });
  playTone({ freq: 262, type: "sine", dur: 0.14, peak: 0.10, start: 0.07, attack: 0.005, release: 0.1 });
}

/* --- Background music (original, gentle, looping) --- */
// A soft, cheerful melody in C major, using bell-like tones + pad.
// Notes in Hz. We schedule ahead with a lookahead scheduler.
const MUSIC_BPM = 88;
const MUSIC_BEAT = 60 / MUSIC_BPM;

// Melody (note, duration in beats). Original composition.
const MELODY = [
  // Phrase A
  ["C5", 1], ["E5", 0.5], ["G5", 0.5], ["E5", 1], ["C5", 1],
  ["D5", 0.5], ["F5", 0.5], ["A5", 1], ["G5", 1],
  // Phrase B
  ["E5", 1], ["G5", 0.5], ["B5", 0.5], ["G5", 1], ["E5", 1],
  ["F5", 0.5], ["A5", 0.5], ["C6", 1], ["B5", 1],
  // Phrase C (lift)
  ["G5", 1], ["C6", 0.5], ["E6", 0.5], ["C6", 1], ["G5", 1],
  ["A5", 0.5], ["F5", 0.5], ["E5", 1], ["D5", 1],
  // Phrase D (resolve)
  ["C5", 1], ["E5", 0.5], ["G5", 0.5], ["C6", 2],
  ["G5", 1], ["E5", 1], ["C5", 2]
];

const NOTE_FREQ = {
  "C4": 261.63, "D4": 293.66, "E4": 329.63, "F4": 349.23, "G4": 392.00, "A4": 440.00, "B4": 493.88,
  "C5": 523.25, "D5": 587.33, "E5": 659.25, "F5": 698.46, "G5": 783.99, "A5": 880.00, "B5": 987.77,
  "C6": 1046.50, "D6": 1174.66, "E6": 1318.51
};

// Simple bass pattern (root notes, long tones)
const BASS = [
  ["C3", 4], ["G3", 4],
  ["A3", 4], ["F3", 4],
  ["C3", 4], ["G3", 4],
  ["F3", 4], ["C3", 4]
];
const BASS_FREQ = {
  "C3": 130.81, "D3": 146.83, "E3": 164.81, "F3": 174.61, "G3": 196.00, "A3": 220.00, "B3": 246.94
};

function musicScheduleNote(freq, when, dur, type = "triangle", peak = 0.14) {
  const ctx = ensureAudio(); if (!ctx) return;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  // Soft bell-like envelope
  osc.type = type;
  osc.frequency.value = freq;

  const attack = 0.015;
  const release = Math.min(0.6, dur * 0.8);
  g.gain.setValueAtTime(0, when);
  g.gain.linearRampToValueAtTime(peak, when + attack);
  g.gain.exponentialRampToValueAtTime(0.0005, when + dur);

  // A gentle lowpass for warmth
  const lp = ctx.createBiquadFilter();
  lp.type = "lowpass";
  lp.frequency.value = 2600;
  lp.Q.value = 0.6;

  osc.connect(lp); lp.connect(g); g.connect(musicGain);
  osc.start(when);
  osc.stop(when + dur + 0.1);
  osc.onended = () => { try { osc.disconnect(); lp.disconnect(); g.disconnect(); } catch(e){} };
}

function musicScheduleLoop() {
  const ctx = ensureAudio(); if (!ctx) return;
  const lookahead = 0.25; // seconds
  const now = ctx.currentTime;

  // Schedule melody
  while (musicNextTime < now + lookahead) {
    // Play one loop starting at musicNextTime
    let t = musicNextTime;
    for (const [n, beats] of MELODY) {
      const dur = beats * MUSIC_BEAT;
      const f = NOTE_FREQ[n];
      if (f) musicScheduleNote(f, t, dur * 0.95, "triangle", 0.11);
      // Add a soft octave-up bell shimmer on every other note
      if (Math.random() < 0.25) {
        musicScheduleNote(f * 2, t + 0.02, dur * 0.6, "sine", 0.035);
      }
      t += dur;
    }
    // Bass pad (long soft tones)
    let tb = musicNextTime;
    for (const [n, beats] of BASS) {
      const dur = beats * MUSIC_BEAT;
      const f = BASS_FREQ[n];
      if (f) musicScheduleNote(f, tb, dur * 0.98, "sine", 0.08);
      tb += dur;
    }

    // Total loop length in seconds
    const melLen = MELODY.reduce((a, b) => a + b[1] * MUSIC_BEAT, 0);
    musicNextTime += melLen;
  }
}

function startMusic() {
  const ctx = ensureAudio(); if (!ctx) return;
  resumeAudio();
  if (musicPlaying) return;
  musicPlaying = true;
  musicNextTime = ctx.currentTime + 0.05;
  // Scheduler tick
  musicScheduler = setInterval(musicScheduleLoop, 120);
  musicScheduleLoop();
  // Fade music gain in
  const now = ctx.currentTime;
  musicGain.gain.cancelScheduledValues(now);
  musicGain.gain.setValueAtTime(musicGain.gain.value, now);
  musicGain.gain.linearRampToValueAtTime(state.audio.musicVol, now + 0.6);
}

function stopMusic(fadeOut = true) {
  if (!audioCtx) { musicPlaying = false; return; }
  musicPlaying = false;
  if (musicScheduler) { clearInterval(musicScheduler); musicScheduler = null; }
  const now = audioCtx.currentTime;
  if (fadeOut) {
    musicGain.gain.cancelScheduledValues(now);
    musicGain.gain.setValueAtTime(musicGain.gain.value, now);
    musicGain.gain.linearRampToValueAtTime(0.0001, now + 0.5);
  } else {
    musicGain.gain.cancelScheduledValues(now);
    musicGain.gain.setValueAtTime(0, now);
  }
}

/* =============================================================
   UI CONTROLS (sound toggles, volume, reset all)
   ============================================================= */
const btnSfx = document.getElementById("btnSfx");
const btnMusic = document.getElementById("btnMusic");
const volMusic = document.getElementById("volMusic");
const btnResetAll = document.getElementById("btnResetAll");
const toastWrap = document.getElementById("toastWrap");

function refreshSoundUI() {
  btnSfx.textContent = state.audio.sfx ? "🔊 Sound Effects: On" : "🔈 Sound Effects: Off";
  btnSfx.setAttribute("aria-pressed", String(state.audio.sfx));
  btnMusic.textContent = state.audio.music ? "🎵 Music: On" : "🎵 Music: Off";
  btnMusic.setAttribute("aria-pressed", String(state.audio.music));
  volMusic.value = String(Math.round(state.audio.musicVol * 100));
  if (sfxGain) sfxGain.gain.value = state.audio.sfx ? 0.9 : 0;
  if (musicGain && audioCtx) {
    const now = audioCtx.currentTime;
    musicGain.gain.cancelScheduledValues(now);
    musicGain.gain.setValueAtTime(musicGain.gain.value, now);
    musicGain.gain.linearRampToValueAtTime(state.audio.music ? state.audio.musicVol : 0, now + 0.2);
  }
}

btnSfx.addEventListener("click", () => {
  resumeAudio();
  state.audio.sfx = !state.audio.sfx;
  refreshSoundUI();
  saveState();
  if (state.audio.sfx) sfxUp(5); // friendly confirmation blip
});

btnMusic.addEventListener("click", () => {
  resumeAudio();
  state.audio.music = !state.audio.music;
  if (state.audio.music) startMusic();
  else stopMusic(true);
  refreshSoundUI();
  saveState();
});

volMusic.addEventListener("input", () => {
  state.audio.musicVol = Number(volMusic.value) / 100;
  if (musicGain && audioCtx) {
    const now = audioCtx.currentTime;
    musicGain.gain.cancelScheduledValues(now);
    musicGain.gain.setValueAtTime(musicGain.gain.value, now);
    musicGain.gain.linearRampToValueAtTime(state.audio.music ? state.audio.musicVol : 0, now + 0.1);
  }
  saveState();
});

function showToast({ message, confirmText = "Yes, reset", cancelText = "Cancel", onConfirm }) {
  // Remove existing toasts
  toastWrap.innerHTML = "";
  const t = document.createElement("div");
  t.className = "toast";
  t.setAttribute("role", "alertdialog");
  t.setAttribute("aria-label", message);

  const msg = document.createElement("span");
  msg.textContent = message;

  const confirmBtn = document.createElement("button");
  confirmBtn.className = "confirm";
  confirmBtn.type = "button";
  confirmBtn.textContent = confirmText;

  const cancelBtn = document.createElement("button");
  cancelBtn.className = "cancel";
  cancelBtn.type = "button";
  cancelBtn.textContent = cancelText;

  t.appendChild(msg);
  t.appendChild(confirmBtn);
  t.appendChild(cancelBtn);
  toastWrap.appendChild(t);

  const close = () => {
    t.style.opacity = "0";
    t.style.transform = "translateY(10px)";
    t.style.transition = "opacity .25s ease, transform .25s ease";
    setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 260);
  };
  confirmBtn.addEventListener("click", () => { close(); onConfirm && onConfirm(); });
  cancelBtn.addEventListener("click", close);
  // Auto-dismiss after 8s if not interacted
  setTimeout(() => { if (t.parentNode) close(); }, 8000);
  confirmBtn.focus();
}

btnResetAll.addEventListener("click", () => {
  showToast({
    message: "Reset all students to level 1?",
    onConfirm: () => {
      for (const s of students) state.scores[s.id] = 1;
      for (const s of students) updateCard(s.id, { animate: true });
      updateStats();
      saveState();
      if (state.audio.sfx) sfxReset();
    }
  });
});

/* =============================================================
   DECORATIVE BACKGROUND
   ============================================================= */
function buildBackground() {
  const layer = document.getElementById("bgLayer");
  layer.innerHTML = "";
  const bubbles = [
    { s: 180, x: "6%",  y: "10%", d: 0 },
    { s: 120, x: "82%", y: "14%", d: 1.2 },
    { s: 220, x: "72%", y: "70%", d: 2.1 },
    { s: 90,  x: "18%", y: "78%", d: 0.6 },
    { s: 140, x: "45%", y: "88%", d: 1.8 },
    { s: 70,  x: "30%", y: "20%", d: 2.4 }
  ];
  bubbles.forEach(b => {
    const el = document.createElement("div");
    el.className = "bubble";
    el.style.width = b.s + "px";
    el.style.height = b.s + "px";
    el.style.left = b.x;
    el.style.top = b.y;
    el.style.animationDelay = b.d + "s";
    layer.appendChild(el);
  });

  const stickers = [
    { e: "🌸", x: "4%",  y: "22%", d: 0.2 },
    { e: "🌼", x: "92%", y: "30%", d: 1.0 },
    { e: "💖", x: "88%", y: "82%", d: 1.6 },
    { e: "⭐", x: "10%", y: "86%", d: 0.8 },
    { e: "🌷", x: "50%", y: "6%",  d: 2.0 },
    { e: "✨", x: "36%", y: "92%", d: 1.3 },
    { e: "🌟", x: "64%", y: "4%",  d: 0.4 }
  ];
  stickers.forEach(s => {
    const el = document.createElement("span");
    el.className = "sticker";
    el.textContent = s.e;
    el.style.left = s.x;
    el.style.top = s.y;
    el.style.animationDelay = s.d + "s";
    layer.appendChild(el);
  });
}

/* =============================================================
   VISIBILITY / LIFECYCLE
   ============================================================= */
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    if (musicPlaying) stopMusic(true);
  } else {
    if (state.audio.music && !musicPlaying) startMusic();
  }
});
window.addEventListener("pagehide", () => {
  try { stopMusic(false); } catch (e) {}
  try { if (audioCtx) audioCtx.close(); } catch (e) {}
});

/* =============================================================
   INIT
   ============================================================= */
loadState();
buildBackground();
renderBoard();
refreshSoundUI();

// First interaction unlocks audio (browser policy)
const unlockAudio = () => {
  resumeAudio();
  if (state.audio.music) startMusic();
  window.removeEventListener("pointerdown", unlockAudio);
  window.removeEventListener("keydown", unlockAudio);
};
window.addEventListener("pointerdown", unlockAudio);
window.addEventListener("keydown", unlockAudio);

</script>
