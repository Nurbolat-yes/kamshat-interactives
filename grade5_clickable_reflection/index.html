<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Learning Traffic Light | Reflection</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Trebuchet MS,Arial,sans-serif;color:#fff;background:radial-gradient(circle at 20% 12%,#847aff 0,transparent 32%),radial-gradient(circle at 80% 85%,#ec62c3 0,transparent 33%),linear-gradient(130deg,#182d82,#4132a2 52%,#622599);overflow-x:hidden}.scene{position:fixed;inset:0;pointer-events:none;overflow:hidden}.float{position:absolute;opacity:.38;font-size:clamp(26px,4vw,55px);animation:drift 9s ease-in-out infinite alternate;filter:drop-shadow(0 8px 8px #120c4e)}@keyframes drift{to{transform:translate(30px,-55px) rotate(18deg)}}main{max-width:1250px;margin:auto;position:relative;padding:24px 22px 36px}header{text-align:center}h1{font-size:clamp(34px,5vw,68px);line-height:1.05;margin:20px 0 8px;text-shadow:0 5px 18px #201153}header p{font-size:clamp(17px,2vw,23px);margin:12px 0 22px}.tag{display:inline-block;background:#ffffff30;padding:8px 20px;border:1px solid #ffffff5c;border-radius:999px;font-weight:800}.buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.choice{min-height:290px;position:relative;border:4px solid #ffffff7a;border-radius:32px;cursor:pointer;padding:18px 14px;color:#17204a;box-shadow:0 12px 0 #130d4b60,0 20px 33px #1a0c4c70;transition:transform .15s,filter .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}.choice:hover{transform:translateY(-7px);filter:brightness(1.08)}.choice:active{transform:translateY(4px)}.green{background:linear-gradient(165deg,#d8ff9e,#38e58c)}.yellow{background:linear-gradient(165deg,#fff1a2,#ffc552)}.red{background:linear-gradient(165deg,#ffe0c4,#ff7d96)}.face{font-size:clamp(65px,8vw,106px);line-height:1;filter:drop-shadow(0 7px 1px #0000001a)}.choice strong{font-size:clamp(22px,2.5vw,36px);text-align:center;line-height:1.12}.choice span.desc{font-size:clamp(15px,1.5vw,20px);line-height:1.35;font-weight:700;text-align:center}.count{margin:auto;background:#ffffff45;border-radius:999px;padding:8px 15px;font-size:18px;font-weight:900}.counter{margin:22px auto 10px;border:1px solid #ffffff52;border-radius:24px;padding:20px 22px;background:#ffffff21;backdrop-filter:blur(12px);max-width:1050px}.counter h2{text-align:center;margin:0 0 14px;font-size:26px}.bars{display:grid;gap:12px}.barrow{display:grid;grid-template-columns:108px 1fr 48px;align-items:center;gap:12px;font-size:18px;font-weight:900}.track{height:24px;border-radius:30px;background:#ffffff45;overflow:hidden}.fill{height:100%;width:0;transition:width .5s ease;border-radius:30px}.barrow:nth-child(1) .fill{background:#38ed90}.barrow:nth-child(2) .fill{background:#ffd44a}.barrow:nth-child(3) .fill{background:#ff7d96}.toolbar{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:20px}.tool{border:1px solid #ffffff68;color:white;background:#ffffff30;border-radius:14px;padding:12px 18px;cursor:pointer;font-size:16px;font-weight:800}.tool:hover{background:#ffffff50}.feedback{text-align:center;min-height:40px;font-size:22px;font-weight:900;color:#fff6ac;margin-top:12px}.footer{text-align:center;opacity:.95;font-size:16px;font-weight:700;margin-top:18px}.confetti{position:fixed;top:-25px;width:12px;height:19px;z-index:100;pointer-events:none;animation:fall 2.4s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(800deg);opacity:0}}@media(max-width:800px){.buttons{grid-template-columns:1fr}.choice{min-height:180px}.barrow{grid-template-columns:75px 1fr 35px}main{padding:16px}}
</style></head><body><div class="scene" aria-hidden="true"><div class="float" style="left:3%;top:13%">📖</div><div class="float" style="left:88%;top:10%;animation-delay:-2s">🔤</div><div class="float" style="left:10%;top:70%;animation-delay:-3s">🔢</div><div class="float" style="left:88%;top:71%;animation-delay:-1s">🌍</div><div class="float" style="left:50%;top:2%;animation-delay:-5s">⭐</div></div><main><header><div class="tag">GRADE 5 • LESSON REFLECTION</div><h1>🚦 MY LEARNING TRAFFIC LIGHT</h1><p>How do you feel about today's lesson? Come to the board and choose one!</p></header><section class="buttons" aria-label="Reflection choices"><button class="choice green" onclick="vote(0)"><span class="face">😄</span><strong>I CAN DO IT!</strong><span class="desc">I can use words, numbers, countries and make sentences.</span><span class="count" id="c0">0 learners</span></button><button class="choice yellow" onclick="vote(1)"><span class="face">🙂</span><strong>I NEED MORE PRACTICE!</strong><span class="desc">I can do some tasks, but I still make mistakes.</span><span class="count" id="c1">0 learners</span></button><button class="choice red" onclick="vote(2)"><span class="face">🥺</span><strong>I NEED HELP!</strong><span class="desc">I need help with words, grammar or speaking.</span><span class="count" id="c2">0 learners</span></button></section><section class="counter"><h2>✨ Our Class Reflection <span id="total">0</span> votes</h2><div class="bars"><div class="barrow"><label>🟢 Green</label><div class="track"><div class="fill" id="b0"></div></div><span id="n0">0</span></div><div class="barrow"><label>🟡 Yellow</label><div class="track"><div class="fill" id="b1"></div></div><span id="n1">0</span></div><div class="barrow"><label>🔴 Red</label><div class="track"><div class="fill" id="b2"></div></div><span id="n2">0</span></div></div><div class="feedback" id="feedback" aria-live="polite">Every learner's choice matters! 🌟</div><div class="toolbar"><button class="tool" id="sound" onclick="toggleSound()">🔊 Sound: ON</button><button class="tool" onclick="undo()">↩ Undo last vote</button><button class="tool" onclick="resetVotes()">🔄 Reset votes</button><button class="tool" onclick="document.documentElement.requestFullscreen?.()">⛶ Full screen</button></div></section><div class="footer">Review: Vocabulary • Numbers • Countries • be • Pronouns • Communication</div></main><script>
let counts=[0,0,0],history=[],sound=true,ctx;function tone(freq,dur,delay=0){if(!sound)return;try{ctx??=new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+delay;o.type='sine';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}function chime(){tone(523,.18);tone(659,.18,.12);tone(784,.25,.25)}function update(){const total=counts.reduce((a,b)=>a+b,0);document.getElementById('total').textContent=total;counts.forEach((n,i)=>{document.getElementById('c'+i).textContent=n+' learner'+(n===1?'':'s');document.getElementById('n'+i).textContent=n;document.getElementById('b'+i).style.width=(total?100*n/total:0)+'%'})}function confetti(){const colors=['#ffde59','#69f6ae','#f47eff','#82d9ff','#ff7494'];for(let i=0;i<65;i++){const e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=colors[i%colors.length];e.style.animationDelay=Math.random()*.5+'s';e.style.animationDuration=1.7+Math.random()*1.2+'s';document.body.append(e);setTimeout(()=>e.remove(),3400)}}function vote(i){counts[i]++;history.push(i);update();chime();confetti();document.getElementById('feedback').textContent=['Amazing! Keep learning and helping each other! 🌟','Good effort! Practice makes progress! 💛','Thank you for sharing! Your teacher can help! ❤️'][i]}function undo(){const i=history.pop();if(i===undefined)return;counts[i]--;update();tone(380,.16);document.getElementById('feedback').textContent='Last vote removed.'}function resetVotes(){if(!confirm('Reset all reflection votes?'))return;counts=[0,0,0];history=[];update();document.getElementById('feedback').textContent='Ready for the class! 🌟'}function toggleSound(){sound=!sound;document.getElementById('sound').textContent=sound?'🔊 Sound: ON':'🔇 Sound: OFF';if(sound)tone(600,.12)}update();
</script></body></html>
