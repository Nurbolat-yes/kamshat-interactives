<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Answer the Questions – My Country Holidays</title>
<style>
:root{
  --ink:#24324a;
  --muted:#68758a;
  --line:#dfe6ef;
  --panel:#ffffff;
  --bg:#f4f7fb;
  --accent:#5962d8;
  --accent-soft:#eef0ff;
  --correct:#23865b;
  --correct-soft:#eaf8f1;
  --gold:#e7aa2d;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--ink);
}
.app{
  width:min(1100px,94vw);
  margin:0 auto;
  padding:22px 0 34px;
}
header{text-align:center;margin-bottom:18px}
.badge{
  display:inline-block;
  background:var(--accent-soft);
  color:var(--accent);
  padding:6px 13px;
  border-radius:999px;
  font-size:.78rem;
  font-weight:900;
  letter-spacing:.06em;
  text-transform:uppercase;
}
h1{
  margin:10px 0 4px;
  font-size:clamp(1.8rem,4vw,2.8rem);
  line-height:1.05;
}
.subtitle{
  margin:0;
  color:var(--muted);
  font-weight:700;
}
.toolbar{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:17px;
  padding:13px 16px;
  margin-bottom:20px;
}
.counter{
  font-weight:900;
  font-size:1rem;
}
.counter span{color:var(--accent)}
.reset{
  border:0;
  border-radius:11px;
  padding:11px 15px;
  background:#eef1f5;
  color:var(--ink);
  font-weight:900;
  cursor:pointer;
}
.reset:hover,.reset:focus-visible{
  background:#e2e6ed;
  outline:3px solid #e5e7ff;
}
.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:18px;
}
.card-wrap{
  perspective:1000px;
  min-width:0;
}
.card{
  position:relative;
  min-height:320px;
  transform-style:preserve-3d;
  transition:transform .55s ease;
  cursor:pointer;
}
.card.flipped{transform:rotateY(180deg)}
.face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:21px;
  box-shadow:0 8px 25px rgba(36,50,74,.07);
  padding:20px;
  display:flex;
  flex-direction:column;
}
.front{
  justify-content:center;
  align-items:center;
  text-align:center;
  background:linear-gradient(145deg,#fff,#f8f9ff);
}
.front .symbol{
  font-size:2.7rem;
  margin-bottom:12px;
}
.number{
  color:var(--accent);
  font-weight:900;
  font-size:.86rem;
  letter-spacing:.07em;
  text-transform:uppercase;
}
.tap{
  margin-top:14px;
  color:var(--muted);
  font-weight:800;
}
.back{
  transform:rotateY(180deg);
  overflow:hidden;
}
.question{
  font-size:1.25rem;
  line-height:1.3;
  font-weight:900;
  margin:9px 0 15px;
}
.answer-area{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  min-height:100px;
}
.show-answer{
  border:0;
  background:var(--accent);
  color:#fff;
  border-radius:12px;
  padding:13px 15px;
  font-weight:900;
  font-size:.98rem;
  cursor:pointer;
  min-height:48px;
}
.show-answer:hover,.show-answer:focus-visible{
  filter:brightness(.95);
  outline:3px solid #dfe1ff;
}
.answer{
  display:none;
  margin-top:14px;
  padding:13px 14px;
  background:var(--accent-soft);
  border-radius:13px;
  line-height:1.45;
  font-weight:750;
}
.answer.visible{
  display:block;
  animation:appear .25s ease;
}
.answer-label{
  display:block;
  color:var(--accent);
  font-size:.75rem;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.06em;
  margin-bottom:5px;
}
.correct-btn{
  border:2px solid #b9dfcc;
  background:var(--correct-soft);
  color:#176344;
  border-radius:11px;
  padding:10px 12px;
  font-weight:900;
  cursor:pointer;
  margin-top:auto;
  min-height:46px;
}
.correct-btn:hover,.correct-btn:focus-visible{
  outline:3px solid #d7f1e3;
}
.card-wrap.completed .face{
  border-color:#a7d7be;
}
.card-wrap.completed .front{
  background:linear-gradient(145deg,#fff,#f0fbf5);
}
.card-wrap.completed .front::after{
  content:"✓ COMPLETED";
  position:absolute;
  top:14px;
  right:14px;
  color:var(--correct);
  font-size:.72rem;
  font-weight:900;
}
.assessment{
  margin-top:22px;
  border-top:1px solid var(--line);
  padding-top:18px;
  color:var(--muted);
  font-size:.92rem;
  line-height:1.55;
}
.assessment strong{color:var(--ink)}
@keyframes appear{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:translateY(0)}
}
@media(max-width:850px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:560px){
  .grid{grid-template-columns:1fr}
  .card{min-height:300px}
  .toolbar{align-items:stretch}
  .reset{width:100%}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

<body>
<main class="app" id="activity">
  <header>
    <div class="badge">Unit 5 · Creativity and Skills</div>
    <h1>MY COUNTRY – HOLIDAYS</h1>
    <p class="subtitle">ANSWER THE QUESTIONS · FLIP CARDS</p>
  </header>

  <section class="toolbar" aria-label="Teacher controls">
    <div class="counter">Questions answered: <span id="counter">0 / 10</span></div>
    <button class="reset" id="resetBtn" type="button">↻ RESET</button>
  </section>

  <section class="grid" id="cardGrid" aria-label="Ten question cards"></section>

  <section class="assessment">
    <strong>Assessment:</strong> 1 point for each correctly answered question. Total: 10 points.<br>
    <strong>Descriptor:</strong> A learner answers questions about special days and celebrations.
  </section>
</main>

<script>
(function(){
  "use strict";

  const data = [
    {
      q:"When is New Year's Day?",
      a:"New Year's Day is on 1st January.",
      icon:"🎄"
    },
    {
      q:"What happens at midnight on 31st December?",
      a:"There are fireworks in cities, towns and villages all over Kazakhstan.",
      icon:"🎆"
    },
    {
      q:"Who do children wait for at New Year?",
      a:"They wait for Ayaz Ata (Father Frost).",
      icon:"🎁"
    },
    {
      q:"When does Nauryz start?",
      a:"Nauryz starts on 21st March.",
      icon:"🌸"
    },
    {
      q:"What do people do at Nauryz?",
      a:"They dress beautifully, smile cheerfully, sing happily, have a party, play games and eat a lot of food.",
      icon:"🎉"
    },
    {
      q:"When don't students have to go to school?",
      a:"They don't have to go to school on 21st, 22nd and 23rd March.",
      icon:"🏫"
    },
    {
      q:"What does everyone have to drink at Nauryz?",
      a:"Everyone has to drink Nauryz kozhe.",
      icon:"🥣"
    },
    {
      q:"When do people celebrate Capital Day?",
      a:"They celebrate Capital Day on 6th July.",
      icon:"🇰🇿"
    },
    {
      q:"What was the capital of Kazakhstan before 1998?",
      a:"Almaty was the capital before 1998.",
      icon:"🏙️"
    },
    {
      q:"What events are there in Astana on Capital Day?",
      a:"There are festivals, competitions and concerts.",
      icon:"🎈"
    }
  ];

  const grid = document.getElementById("cardGrid");
  const counter = document.getElementById("counter");
  const resetBtn = document.getElementById("resetBtn");

  let completed = new Set();

  function createCard(item,index){
    const wrap = document.createElement("article");
    wrap.className = "card-wrap";
    wrap.dataset.index = index;

    const card = document.createElement("div");
    card.className = "card";

    const front = document.createElement("div");
    front.className = "face front";
    front.innerHTML =
      '<div class="symbol" aria-hidden="true">'+item.icon+'</div>' +
      '<div class="number">Question '+(index+1)+'</div>' +
      '<div class="tap">Tap to reveal</div>';

    const back = document.createElement("div");
    back.className = "face back";

    const question = document.createElement("div");
    question.className = "question";
    question.textContent = item.q;

    const answerArea = document.createElement("div");
    answerArea.className = "answer-area";

    const showBtn = document.createElement("button");
    showBtn.type = "button";
    showBtn.className = "show-answer";
    showBtn.textContent = "SHOW ANSWER";

    const answer = document.createElement("div");
    answer.className = "answer";
    answer.innerHTML =
      '<span class="answer-label">ANSWER</span>' +
      escapeHtml(item.a);

    const correctBtn = document.createElement("button");
    correctBtn.type = "button";
    correctBtn.className = "correct-btn";
    correctBtn.textContent = "✓ Correct";

    answerArea.appendChild(showBtn);
    answerArea.appendChild(answer);
    back.appendChild(question);
    back.appendChild(answerArea);
    back.appendChild(correctBtn);

    card.appendChild(front);
    card.appendChild(back);
    wrap.appendChild(card);
    grid.appendChild(wrap);

    card.addEventListener("click", function(event){
      if(event.target.closest("button")) return;
      card.classList.toggle("flipped");
    });

    card.addEventListener("keydown", function(event){
      if((event.key === "Enter" || event.key === " ") &&
         !event.target.closest("button")){
        event.preventDefault();
        card.classList.toggle("flipped");
      }
    });

    showBtn.addEventListener("click", function(event){
      event.stopPropagation();
      card.classList.add("flipped");
      answer.classList.add("visible");
      showBtn.textContent = "ANSWER SHOWN";
      showBtn.disabled = true;
      showBtn.style.opacity = ".7";
    });

    correctBtn.addEventListener("click", function(event){
      event.stopPropagation();
      if(completed.has(index)){
        completed.delete(index);
        wrap.classList.remove("completed");
        correctBtn.textContent = "✓ Correct";
      }else{
        completed.add(index);
        wrap.classList.add("completed");
        correctBtn.textContent = "✓ Completed";
      }
      updateCounter();
    });

    return wrap;
  }

  function render(){
    grid.innerHTML = "";
    data.forEach(createCard);
    updateCounter();
  }

  function updateCounter(){
    counter.textContent = completed.size + " / " + data.length;
  }

  function reset(){
    completed.clear();
    render();
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function escapeHtml(value){
    return value.replace(/[&<>"']/g,function(ch){
      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[ch];
    });
  }

  resetBtn.addEventListener("click",reset);
  render();
})();
</script>
</body>
</html>
