<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Our Heroes – Flip Cards</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<style>
:root{--ink:#1d2b53;--paper:#fff8e7}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#ffd166,#ef476f 55%,#118ab2);background-size:300% 300%;animation:bg 16s ease infinite;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
@keyframes bg{50%{background-position:100% 50%}}
header{display:flex;align-items:center;justify-content:center;gap:16px;padding:10px}
h1{margin:0;color:#fff;font-size:clamp(22px,3.6vw,40px);text-shadow:0 3px 8px #0005}
#mus{border:0;border-radius:50%;width:44px;height:44px;font-size:22px;cursor:pointer;background:#fff;box-shadow:0 4px 0 #0003}
#grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);gap:clamp(8px,1.6vw,22px);padding:0 clamp(8px,2vw,30px) clamp(8px,2vw,30px)}
@media(max-width:700px){#grid{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(5,1fr)}}
.c{border:0;border-radius:24px;font:inherit;font-size:clamp(36px,7.5vw,100px);font-weight:900;color:#fff;cursor:pointer;text-shadow:0 4px 0 #0003;box-shadow:0 8px 0 #0003,0 16px 26px #0003;transition:transform .2s,opacity .4s}
.c:hover,.c:focus-visible{transform:translateY(-5px) rotate(-2deg) scale(1.04);outline:4px solid #fff}
.c.done{opacity:.35;background:#444!important;pointer-events:none;box-shadow:none}
#m{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:5;perspective:1400px;overflow:auto}
#m.on{display:flex}
#q{width:min(780px,100%);background:var(--paper);border-radius:30px;padding:clamp(18px,4vw,42px);text-align:center;color:var(--ink);box-shadow:0 20px 60px #0008;animation:flip .6s ease}
@keyframes flip{from{transform:rotateY(180deg) scale(.5)}to{transform:none}}
#q.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-16px)}40%,80%{transform:translateX(16px)}}
#n{display:inline-block;color:#fff;border-radius:50px;padding:4px 20px;font-weight:900;font-size:22px}
#t{font-size:clamp(20px,3.4vw,32px);font-weight:800;margin:16px 0}
.o{display:block;width:100%;margin:10px 0;padding:14px;font:inherit;font-size:clamp(16px,2.6vw,24px);font-weight:700;color:var(--ink);border:3px solid var(--ink);border-radius:18px;background:#fff;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .1s}
.o:hover:not(:disabled){transform:translateY(-2px);background:#e3f4ff}
.o:disabled{cursor:default}
.o.ok{background:#06d6a0!important;color:#fff;border-color:#048a68;box-shadow:0 5px 0 #048a68}
.o.bad{background:#ef476f!important;color:#fff;border-color:#a9244a;box-shadow:0 5px 0 #a9244a}
#f{min-height:34px;font-size:clamp(17px,2.6vw,24px);font-weight:800;margin:10px 0}
#b{display:none;border:0;border-radius:50px;padding:12px 36px;font:inherit;font-size:22px;font-weight:900;color:#fff;background:var(--ink);cursor:pointer}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<header><h1>Our Heroes: pick a card!</h1><button id="mus" title="Music on/off" aria-label="Music">🎵</button></header>
<main id="grid"></main>
<div id="m"><div id="q"><span id="n"></span><div id="t"></div><div id="o"></div><div id="f"></div><button id="b">Back</button></div></div>
<script>
// first option in each "a" array is the correct answer (options are shuffled on screen)
const Q=[
{q:"Who was Kazakhstan's first cosmonaut?",a:["Toktar Aubakirov","Abilkhan Kasteev","Roza Baglanova"]},
{q:"In which year was Toktar part of the Soyuz space mission?",a:["1991","1922","1941"]},
{q:"What was Toktar's job in the Kazakh air force?",a:["Test pilot","Railway worker","Soloist"]},
{q:"How many planes did Toktar test?",a:["Over 50","Over 20","Over 500"]},
{q:"Toktar was the first person to fly nonstop over…",a:["the North Pole","Mount Everest","the Caspian Sea"]},
{q:"What does Toktar do today?",a:["Trains young people at workshops","Tests new planes","Paints pictures"]},
{q:"Where was Roza Baglanova born?",a:["Kazalinsk","Almaty","Tashkent"]},
{q:"In which year was Roza Baglanova born?",a:["1922","1991","1950"]},
{q:"How old was Roza when she started singing as a soloist?",a:["19","29","9"]},
{q:"Which group did Roza sing with as a soloist?",a:["Song and Dance Ensemble of the Uzbek Philharmonic","Kazakh air force team","Soyuz space team"]},
{q:"What did Roza sing?",a:["Operas and popular songs","Only jazz","Only rock music"]},
{q:"Who painted over two thousand pictures?",a:["Abilkhan Kasteev","Toktar Aubakirov","Roza Baglanova"]},
{q:"How many pictures did Abilkhan paint?",a:["Over 2,000","Over 200","Over 20,000"]},
{q:"Where did Abilkhan work?",a:["In the countryside","In space","In an opera house"]},
{q:"Which job did Abilkhan have?",a:["Railway worker","Cosmonaut","Test pilot"]}];
let AC,musOn=true,timer,step=0;
const ctx=()=>{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.state=='suspended'&&AC.resume();return AC};
function tone(f,t,d,type='sine',v=.15){try{const c=ctx(),o=c.createOscillator(),g=c.createGain(),s=c.currentTime+t;o.type=type;o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d+.05)}catch(e){}}
const sc=[261.6,293.7,329.6,392,440,523.3,587.3,659.3],pat=[0,2,4,5,4,2,3,1,0,2,4,7,5,4,2,3];
function music(){clearInterval(timer);if(!musOn)return;timer=setInterval(()=>{const i=step++%pat.length;tone(sc[pat[i]],0,.45,'triangle',.05);if(i%4==0)tone(sc[pat[i]]/2,0,.9,'sine',.06)},280)}
const sfx={ok:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.1,.3,'triangle',.18)),bad:()=>{tone(220,0,.25,'sawtooth',.12);tone(150,.2,.4,'sawtooth',.12)},flip:()=>{tone(500,0,.1,'square',.06);tone(750,.07,.1,'square',.06)}};
document.getElementById('mus').onclick=e=>{musOn=!musOn;e.target.textContent=musOn?'🎵':'🔇';music()};
const $=id=>document.getElementById(id),grid=$('grid'),col=i=>`hsl(${i*24},78%,52%)`;
Q.forEach((_,i)=>{const b=document.createElement('button');b.className='c';b.textContent=i+1;b.style.background=col(i);b.onclick=()=>open(i,b);grid.append(b)});
let cur,curCorrect=false;
function open(i,btn){if(!AC||!timer)music();ctx();sfx.flip();cur=btn;curCorrect=false;const d=Q[i];
$('n').textContent='Card '+(i+1);$('n').style.background=col(i);$('t').textContent=d.q;$('f').textContent='';$('b').style.display='none';
const q=$('q');q.classList.remove('shake');q.style.animation='none';q.offsetWidth;q.style.animation='';
const o=$('o');o.innerHTML='';
d.a.map((t,k)=>({t,c:k==0})).sort(()=>Math.random()-.5).forEach(x=>{const b=document.createElement('button');b.className='o';b.textContent=x.t;b.dataset.c=x.c?1:0;b.onclick=()=>pick(b,x.c);o.append(b)});
$('m').classList.add('on')}
function pick(b,ok){const all=[...document.querySelectorAll('.o')];all.forEach(x=>x.disabled=true);curCorrect=ok;$('b').style.display='inline-block';
if(ok){b.classList.add('ok');$('f').textContent='🎉 Correct! Well done!';$('f').style.color='#048a68';sfx.ok();if(typeof confetti==='function')confetti({particleCount:160,spread:90,origin:{y:.6},zIndex:99})}
else{b.classList.add('bad');all.find(x=>x.dataset.c==1).classList.add('ok');$('f').textContent='❌ Not quite. The right answer is in green.';$('f').style.color='#c0304f';sfx.bad();const q=$('q');q.style.animation='none';q.offsetWidth;q.style.animation='';q.classList.add('shake')}
}
$('b').onclick=()=>{$('m').classList.remove('on');sfx.flip();
if(curCorrect){cur.classList.add('done');cur.textContent='✓';cur.disabled=true;
if(document.querySelectorAll('.c.done').length==15){setTimeout(()=>{if(typeof confetti==='function')confetti({particleCount:400,spread:160,origin:{y:.5},zIndex:99});sfx.ok()},400)}}};
</script></body></html>
