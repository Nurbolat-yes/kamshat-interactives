<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My ABC & Phonics 🌈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============ DECORATIVE BACKGROUND ============ -->
<div class="bg-decor" aria-hidden="true">
  <div class="cloud cloud-1">☁️</div>
  <div class="cloud cloud-2">☁️</div>
  <div class="cloud cloud-3">☁️</div>
  <div class="star twinkle s1">✨</div>
  <div class="star twinkle s2">⭐</div>
  <div class="star twinkle s3">✨</div>
  <div class="star twinkle s4">⭐</div>
  <div class="balloon b1">🎈</div>
  <div class="balloon b2">🎈</div>
  <div class="bubble bub1">🫧</div>
  <div class="bubble bub2">🫧</div>
  <div class="sun">🌞</div>
</div>

<!-- ============ TOP BAR ============ -->
<header class="topbar">
  <div class="logo">🌈 My ABC & Phonics</div>
  <div class="stats">
    <div class="stat" title="Total Stars"><span>⭐</span><span id="totalStars">0</span></div>
    <div class="stat" title="Daily Streak"><span>🔥</span><span id="streakCount">0</span></div>
    <div class="stat" title="Badges"><span>🏆</span><span id="badgeCount">0</span></div>
  </div>
  <div class="controls">
    <button id="muteBtn" class="btn-pill" title="Toggle sound">🔊</button>
    <button id="trophyBtn" class="btn-pill" title="Trophy Room">🏅</button>
    <button id="themeBtn" class="btn-pill" title="Night mode">🌙</button>
  </div>
</header>

<!-- ============ MAIN APP ============ -->
<main id="app">
  <!-- Quest Map Screen -->
  <section id="mapScreen" class="screen active">
    <h1 class="screen-title">🗺️ Phonics Adventure Map</h1>
    <div class="progress-wrap">
      <div class="progress-label">Overall Progress</div>
      <div class="progress-bar"><div id="overallProgress" class="progress-fill"></div></div>
    </div>
    <div id="questMap" class="quest-map"></div>
  </section>

  <!-- Lesson Screen -->
  <section id="lessonScreen" class="screen">
    <button class="btn-back" id="backBtn">← Back to Map</button>
    <div class="lesson-header">
      <div class="lesson-icon" id="lessonIcon">🅰️</div>
      <div>
        <h2 id="lessonTitle">Lesson Title</h2>
        <p id="lessonDesc" class="lesson-desc">Description</p>
      </div>
    </div>
    <div class="lesson-stars" id="lessonStars">⭐⭐⭐</div>
    <div class="game-picker" id="gamePicker"></div>
  </section>

  <!-- Game Screen -->
  <section id="gameScreen" class="screen">
    <button class="btn-back" id="exitGameBtn">← Exit</button>
    <div class="game-hud">
      <div class="hud-item"><span>⭐</span><span id="hudStars">0</span></div>
      <div class="hud-item"><span>✅</span><span id="hudScore">0</span></div>
      <div class="hud-item"><span>🎯</span><span id="hudProgress">0/0</span></div>
    </div>
    <div id="gameArea" class="game-area"></div>
    <div class="game-controls">
      <button id="hintBtn" class="btn-chunky btn-hint">💡 Hint</button>
      <button id="nextBtn" class="btn-chunky btn-next" style="display:none">Next ➡️</button>
    </div>
  </section>
</main>

<!-- ============ MASCOT ============ -->
<div id="mascot" class="mascot" aria-hidden="true">
  <div class="mascot-body">🐻</div>
  <div class="mascot-bubble" id="mascotBubble">Hi! Let's learn!</div>
</div>

<!-- ============ MODALS ============ -->
<div id="modalRoot" class="modal-root"></div>

<!-- ============ CONFETTI CANVAS ============ -->
<canvas id="confettiCanvas"></canvas>

<script src="script.js"></script>
</body>
</html>
